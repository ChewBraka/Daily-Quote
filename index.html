<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Daily Quote</title>
<link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
<style>
  #intro-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
}
#startup-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#0b0b0f; color:#fff; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { min-height:100vh; display:flex; justify-content:center; }
  .page { width:min(1100px,100%); padding:28px 18px 36px; display:flex; flex-direction:column; gap:18px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:15px; }
  .title { font-size:clamp(22px,4vw,32px); font-weight:800; letter-spacing:-.03em; }
  .subtitle { color:#8f9099; font-size:14px; margin-top:3px; }
  .counter { color:#aaa; font-size:13px; white-space:nowrap; }
  .card { position:relative; width:100%; min-height:55vh; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:18px; background:#15151b; box-shadow:0 20px 70px #0008; }
  #photo { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; object-fit:contain; }
  .loading { color:#888; padding:60px 20px; text-align:center; }
  .error { color:#bbb; padding:60px 20px; text-align:center; max-width:600px; line-height:1.6; }
  .error strong { color:#fff; }
  .controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  button { border:1px solid #33343d; background:#191a20; color:#fff; border-radius:10px; padding:11px 16px; font:inherit; font-size:14px; cursor:pointer; transition:.15s ease; }
  button:hover { background:#24252d; transform:translateY(-1px); }
  button.primary { background:#fff; color:#111; border-color:#fff; font-weight:700; }
  button.primary:hover { background:#e9e9e9; }
  .info { text-align:center; color:#777983; font-size:13px; }
  .info b { color:#bbb; }
  @media (max-width:600px) {
    .page { padding:18px 12px 25px; }
    header { align-items:flex-start; }
    .counter { margin-top:5px; }
    .card { min-height:60vh; border-radius:12px; }
    #photo { max-height:68vh; }
  }
</style>
</head>
<body>
  <div id="intro-overlay">
  <video id="startup-video" autoplay muted playsinline>
    <source src="your-video-file.mp4" type="video/mp4">
  </video>
</div>
<script>
const video = document.getElementById('startup-video');
const overlay = document.getElementById('intro-overlay');

video.onended = () => {
  overlay.style.display = 'none';
};
</script>
  <!-- The Audio Player -->
<audio id="bgMusic" loop>
  <source src="images/music.mp3" type="audio/mpeg">
</audio>

<!-- The Floating Toggle Button -->
<button id="musicBtn" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  padding: 12px 20px;
  font-size: 14px;
  font-family: sans-serif;
  font-weight: bold;
  background-color: #222222;
  color: #ffffff;
  border: none;
  border-radius: 50px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  transition: transform 0.2s ease, background-color 0.2s ease;
">
  🎵 Play Music
</button>

<!-- The Script -->
<script>
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');

  // Add a subtle hover effect via JavaScript to keep it self-contained
  btn.addEventListener('mouseenter', () => btn.style.transform = 'scale(1.05)');
  btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');

  btn.addEventListener('click', function() {
    if (audio.paused) {
      audio.play();
      btn.innerHTML = "⏸️ Pause Music";
      btn.style.backgroundColor = "#ff4757"; // Changes color when playing
    } else {
      audio.pause();
      btn.innerHTML = "🎵 Play Music";
      btn.style.backgroundColor = "#222222"; // Resets color when paused
    }
  });
</script>
<main class="page">
  <header>
    <div>
      <div class="title">Daily Quote</div>
      <div class="subtitle" id="dateText">Loading today's quote…</div>
    </div>
    <div class="counter" id="counter"></div>
  </header>

  <section class="card" aria-live="polite">
    <div class="loading" id="loading">Loading…</div>
    <img id="photo" alt="Today's daily quote" hidden>
  </section>

  <div class="controls">
    <button class="primary" id="todayBtn">Today's quote</button>
    <button id="randomBtn">🎲 Show random</button>
  </div>

  <div class="info" id="info"></div>
</main>

<script>
/*
  SETUP:
  Put your 365 images in /images/ and name them:
  001.jpg, 002.jpg, ... 365.jpg

  PNG/JPEG/WebP are supported — just change IMAGE_EXT below
  if your images use another extension.
*/
const IMAGE_COUNT = 365;
const IMAGE_EXT = "jpg";
const IMAGE_FOLDER = "images/";

const photo = document.getElementById("photo");
const loading = document.getElementById("loading");
const dateText = document.getElementById("dateText");
const counter = document.getElementById("counter");
const info = document.getElementById("info");
const todayBtn = document.getElementById("todayBtn");
const randomBtn = document.getElementById("randomBtn");

let dailyIndex = 0;
let currentObject = null;

function pad(n) { return String(n).padStart(3, "0"); }

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Seeded shuffle: everyone gets the same shuffled order for the year.
function makeOrder(year) {
  const a = Array.from({length: IMAGE_COUNT}, (_, i) => i + 1);
  let seed = hashString("daily-photo-" + year);
  function random() {
    seed += 0x6D2B79F5;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Number of complete days since January 1 of this year.
function dayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 1);
  const current = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return Math.floor((current - start) / 86400000);
}

function fileUrl(index) {
  return IMAGE_FOLDER + pad(index) + "." + IMAGE_EXT;
}

function showImage(index, isDaily) {
  dailyIndex = index;
  loading.hidden = true;
  photo.hidden = false;
  photo.src = fileUrl(index);
  photo.alt = isDaily ? "Today's daily quote" : "Random quote";
  counter.textContent = isDaily ? "Today's quote" : "Random quote";
  info.innerHTML = isDaily
    ? `Photo <b>${pad(index)}</b> of ${IMAGE_COUNT}`
    : `Photo <b>${pad(index)}</b> of ${IMAGE_COUNT} · click “Today's quote” to return`;
}

function showDaily() {
  const now = new Date();
  const order = makeOrder(now.getFullYear());
  const day = dayOfYear(now);
  const position = day % IMAGE_COUNT;
  showImage(order[position], true);

  dateText.textContent = now.toLocaleDateString(undefined, {
    weekday:"long", year:"numeric", month:"long", day:"numeric"
  });
}

function showRandom() {
  let index;
  do {
    index = Math.floor(Math.random() * IMAGE_COUNT) + 1;
  } while (IMAGE_COUNT > 1 && index === dailyIndex);
  showImage(index, false);
}

photo.addEventListener("error", () => {
  photo.hidden = true;
  loading.hidden = false;
  loading.className = "error";
  loading.innerHTML =
    `<strong>Couldn't load this image.</strong><br>` +
    `Make sure <code>images/${pad(dailyIndex)}.${IMAGE_EXT}</code> exists.`;
});

todayBtn.addEventListener("click", showDaily);
randomBtn.addEventListener("click", showRandom);

showDaily();

// If someone leaves the page open overnight, update automatically.
setInterval(() => {
  const now = new Date();
  const key = now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
  if (key !== window.__dailyKey) {
    window.__dailyKey = key;
    showDaily();
  }
}, 30000);

window.__dailyKey = (() => {
  const d = new Date();
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
})();
</script>
</body>
</html>
