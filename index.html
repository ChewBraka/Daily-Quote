<style>
/* =========================================
   LIGHTHOUSE PHOTO REVEAL
   ========================================= */

.card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: #05070b;
}

/* Keep the actual image slightly dark during the reveal */
#photo {
  position: relative;
  z-index: 1;
  display: block;
  max-width: 100%;
  max-height: 72vh;
  width: auto;
  height: auto;
  object-fit: contain;

  filter: brightness(0.18);
  transform: scale(1.035);
}

/* Dark atmosphere covering the photo */
.card.lighthouse-reveal::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;

  background: rgba(0, 0, 0, 0.48);

  animation: darknessFade 2.4s ease-out forwards;
}

@keyframes darknessFade {
  0% {
    opacity: 1;
  }

  65% {
    opacity: 0.45;
  }

  100% {
    opacity: 0;
  }
}


/* =========================================
   THE LIGHTHOUSE BEAM
   ========================================= */

.card.lighthouse-reveal::after {
  content: "";
  position: absolute;
  z-index: 3;
  pointer-events: none;

  /*
     The beam starts outside the left side
     and points toward the centre.
  */
  top: -55%;
  left: -65%;

  width: 180%;
  height: 210%;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,0) 0%,
      rgba(255,248,220,0.02) 32%,
      rgba(255,248,220,0.12) 44%,
      rgba(255,255,235,0.75) 49%,
      rgba(255,248,220,0.20) 54%,
      rgba(255,255,255,0) 65%
    );

  filter: blur(3px);

  transform-origin: left center;

  animation:
    lighthouseSweep 2.4s cubic-bezier(.15,.65,.25,1) forwards;
}


/* Main sweeping movement */
@keyframes lighthouseSweep {

  0% {
    transform:
      translateX(-45%)
      rotate(-8deg);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  45% {
    transform:
      translateX(10%)
      rotate(-1deg);
    opacity: 1;
  }

  75% {
    transform:
      translateX(65%)
      rotate(5deg);
    opacity: 0.85;
  }

  100% {
    transform:
      translateX(125%)
      rotate(10deg);
    opacity: 0;
  }
}


/* =========================================
   PHOTO REVEAL
   ========================================= */

#photo.lighthouse-photo-reveal {
  animation: photoReveal 2.4s ease-out forwards;
}

@keyframes photoReveal {

  0% {
    filter:
      brightness(0.12)
      saturate(0.6);

    transform: scale(1.035);
  }

  30% {
    filter:
      brightness(0.28)
      saturate(0.75);

    transform: scale(1.025);
  }

  55% {
    filter:
      brightness(0.85)
      saturate(0.95);

    transform: scale(1.015);
  }

  75% {
    filter:
      brightness(1.15)
      saturate(1.05);

    transform: scale(1.005);
  }

  100% {
    filter:
      brightness(1)
      saturate(1);

    transform: scale(1);
  }
}


/* =========================================
   LITTLE LIGHT FLASH
   ========================================= */

.card.lighthouse-reveal {
  animation: cardGlow 2.4s ease-out;
}

@keyframes cardGlow {

  0% {
    box-shadow:
      0 20px 70px rgba(0,0,0,0.5);
  }

  45% {
    box-shadow:
      0 20px 70px rgba(0,0,0,0.5),
      0 0 45px rgba(255,245,210,0.12);
  }

  70% {
    box-shadow:
      0 20px 70px rgba(0,0,0,0.5),
      0 0 70px rgba(255,245,210,0.08);
  }

  100% {
    box-shadow:
      0 20px 70px rgba(0,0,0,0.5);
  }
}


/* Respect reduced-motion settings */
@media (prefers-reduced-motion: reduce) {

  #photo.lighthouse-photo-reveal,
  .card.lighthouse-reveal::before,
  .card.lighthouse-reveal::after,
  .card.lighthouse-reveal {
    animation: none;
  }

  #photo {
    filter: none;
    transform: none;
  }
}

<!-- The Script -->
<script>
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');

  // Add a subtle hover effect
  btn.addEventListener('mouseenter', () => {
    btn.style.transform = 'scale(1.05)';
  });

  btn.addEventListener('mouseleave', () => {
    btn.style.transform = 'scale(1)';
  });

  btn.addEventListener('click', function() {

    if (audio.paused) {

      // Pick a random starting point in the audio
      if (audio.duration && isFinite(audio.duration)) {
        audio.currentTime = Math.random() * audio.duration;
      }

      audio.play();

      btn.innerHTML = "⏸️ Pause Music";
      btn.style.backgroundColor = "#ff4757";

    } else {

      audio.pause();

      btn.innerHTML = "🎵 Play Music";
      btn.style.backgroundColor = "#222222";

    }

  });
</script>

<script>
/*
  SETUP:
  Put your 365 images in /images/ and name them:
  001.jpg, 002.jpg, ... 365.jpg

  PNG/JPEG/WebP are supported — just change IMAGE_EXT below
  if your images use another extension.
*/
const IMAGE_COUNT = 365;
const IMAGE_EXT = "jpg";
const IMAGE_FOLDER = "images/";

const photo = document.getElementById("photo");
const loading = document.getElementById("loading");
const dateText = document.getElementById("dateText");
const counter = document.getElementById("counter");
const info = document.getElementById("info");
const todayBtn = document.getElementById("todayBtn");
const randomBtn = document.getElementById("randomBtn");

let dailyIndex = 0;
let currentObject = null;

function pad(n) { return String(n).padStart(3, "0"); }

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Seeded shuffle: everyone gets the same shuffled order for the year.
function makeOrder(year) {
  const a = Array.from({length: IMAGE_COUNT}, (_, i) => i + 1);
  let seed = hashString("daily-photo-" + year);
  function random() {
    seed += 0x6D2B79F5;
    let t = seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Number of complete days since January 1 of this year.
function dayOfYear(date) {
  const start = new Date(date.getFullYear(), 0, 1);
  const current = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return Math.floor((current - start) / 86400000);
}

function fileUrl(index) {
  return IMAGE_FOLDER + pad(index) + "." + IMAGE_EXT;
}

function showImage(index, isDaily) {
  dailyIndex = index;

  loading.hidden = true;
  photo.hidden = false;

  const card = document.querySelector(".card");

  // Reset everything
  card.classList.remove("lighthouse-reveal");
  photo.classList.remove("lighthouse-photo-reveal");

  // Force browser to restart the animation
  void card.offsetWidth;

  // Set the new image
  photo.src = fileUrl(index);

  photo.alt = isDaily
    ? "Today's daily quote"
    : "Random quote";

  counter.textContent = isDaily
    ? "Today's quote"
    : "Random quote";

  info.innerHTML = isDaily
    ? `Photo <b>${pad(index)}</b> of ${IMAGE_COUNT}`
    : `Photo <b>${pad(index)}</b> of ${IMAGE_COUNT}`;

  // Start lighthouse reveal
  card.classList.add("lighthouse-reveal");
  photo.classList.add("lighthouse-photo-reveal");
}
// 1. Jouw originele functie (voor de afbeelding en de eerste keer laden)
function showDaily() {
  const now = new Date();
  const order = makeOrder(now.getFullYear());
  const day = dayOfYear(now);
  const position = day % IMAGE_COUNT;
  showImage(order[position], true);

  // Update de klok direct bij het laden van de pagina
  updateKlok();
}

// 2. De nieuwe, aparte functie voor de klok
function updateKlok() {
  const now = new Date();
  dateText.textContent = now.toLocaleString(undefined, {
    weekday: "long", 
    year: "numeric", 
    month: "long", 
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });
}

// 3. Zorg dat de klok elke seconde live tikt
setInterval(updateKlok, 1000);

function showRandom() {
  let index;
  do {
    index = Math.floor(Math.random() * IMAGE_COUNT) + 1;
  } while (IMAGE_COUNT > 1 && index === dailyIndex);
  showImage(index, false);
}

photo.addEventListener("error", () => {
  photo.hidden = true;
  loading.hidden = false;
  loading.className = "error";
  loading.innerHTML =
    `<strong>Couldn't load this image.</strong><br>` +
    `Make sure <code>images/${pad(dailyIndex)}.${IMAGE_EXT}</code> exists.`;
});

todayBtn.addEventListener("click", showDaily);
randomBtn.addEventListener("click", showRandom);

showDaily();

// If someone leaves the page open overnight, update automatically.
setInterval(() => {
  const now = new Date();
  const key = now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
  if (key !== window.__dailyKey) {
    window.__dailyKey = key;
    showDaily();
  }
}, 30000);

window.__dailyKey = (() => {
  const d = new Date();
  return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
})();
</script>
