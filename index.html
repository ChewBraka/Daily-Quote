<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Daily Quote</title>
<link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
<style>
  #intro-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #startup-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #starfield {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1; /* Keeps the stars safely in the background */
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:#0b0b0f; color:#fff; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  body { min-height:100vh; display:flex; justify-content:center; }
  .page { width:min(1100px,100%); padding:28px 18px 36px; display:flex; flex-direction:column; gap:18px; position: relative; z-index: 1; }
  header { display:flex; align-items:center; justify-content:space-between; gap:15px; }
  .title { font-size:clamp(22px,4vw,32px); font-weight:800; letter-spacing:-.03em; }
  .subtitle { color:#8f9099; font-size:14px; margin-top:3px; }
  .counter { color:#aaa; font-size:13px; white-space:nowrap; }
  .card { position:relative; width:100%; min-height:55vh; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:18px; background:#15151b; box-shadow:0 20px 70px #0008; }
  #photo { display:block; max-width:100%; max-height:72vh; width:auto; height:auto; object-fit:contain; }
  .loading { color:#888; padding:60px 20px; text-align:center; }
  .error { color:#bbb; padding:60px 20px; text-align:center; max-width:600px; line-height:1.6; }
  .error strong { color:#fff; }
  .controls { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  button { border:1px solid #33343d; background:#191a20; color:#fff; border-radius:10px; padding:11px 16px; font:inherit; font-size:14px; cursor:pointer; transition:.15s ease; }
  button:hover { background:#24252d; transform:translateY(-1px); }
  button.primary { background:#fff; color:#111; border-color:#fff; font-weight:700; }
  button.primary:hover { background:#e9e9e9; }
  .info { text-align:center; color:#777983; font-size:13px; }
  .info b { color:#bbb; }
  @media (max-width:600px) {
    .page { padding:18px 12px 25px; }
    header { align-items:flex-start; }
    .counter { margin-top:5px; }
    .card { min-height:60vh; border-radius:12px; }
    #photo { max-height:68vh; }
  }
</style>
</head>
<body>

<div id="intro-overlay">
  <video id="startup-video" autoplay muted playsinline>
    <source src="images/intro.mp4" type="video/mp4">
  </video>
</div>

<!-- The Audio Player -->
<audio id="bgMusic" loop>
  <source src="images/music.mp3" type="audio/mpeg">
</audio>

<!-- The Floating Toggle Button -->
<button id="musicBtn" style="
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  padding: 12px 20px;
  font-size: 14px;
  font-family: sans-serif;
  font-weight: bold;
  background-color: #222222;
  color: #ffffff;
  border: none;
  border-radius: 50px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  cursor: pointer;
  transition: transform 0.2s ease, background-color 0.2s ease;
">
  🎵 Play Music
</button>

<canvas id="starfield"></canvas>

<main class="page">
  <header>
    <div>
      <div class="title">Daily Quote</div>
      <div class="subtitle" id="dateText">Loading today's quote…</div>
    </div>
    <div class="counter" id="counter"></div>
  </header>

  <section class="card" aria-live="polite">
    <div class="loading" id="loading">Loading…</div>
    <img id="photo" alt="Today's daily quote" hidden>
  </section>

  <div class="controls">
    <button class="primary" id="todayBtn">Today's quote</button>
    <button id="randomBtn">🎲 Show random</button>
  </div>

  <div class="info" id="info"></div>
</main>

<script>
  // 1. Video Overlay Control
  const video = document.getElementById('startup-video');
  const overlay = document.getElementById('intro-overlay');

  video.onended = () => {
    overlay.style.display = 'none';
  };

  // 2. Music Player Control
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');

  btn.addEventListener('mouseenter', () => btn.style.transform = 'scale(1.05)');
  btn.addEventListener('mouseleave', () => btn.style.transform = 'scale(1)');

  btn.addEventListener('click', function() {
    if (audio.paused) {
      audio.play();
      btn.innerHTML = "⏸️ Pause Music";
      btn.style.backgroundColor = "#ff4757";
    } else {
      audio.pause();
      btn.innerHTML = "🎵 Play Music";
      btn.style.backgroundColor = "#222222";
    }
  });

  // 3. Starry Field Background Animation
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];
  const STAR_COUNT = 150;

  function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
  }

  function initStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
              x: Math.random() * canvas.width,
              y: Math.random() * canvas.height,
              size: Math.random() * 1.5 + 0.5,
              twinklespeed: Math.random() * 0.05 + 0.01,
              phase: Math.random() * Math.PI
          });
      }
  }

  function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
          star.phase += star.twinklespeed;
          const alpha = 0.6 + Math.sin(star.phase) * 0.4; 
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fill();
      });
      requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  animate();

  // 4. Quote System Setup (Restored & Repaired)
  document.addEventListener("DOMContentLoaded", () => {
    const IMAGE_COUNT = 365;
    const IMAGE_EXT = "jpg";
    const IMAGE_FOLDER = "images/";

    const photo = document.getElementById("photo");
    const loading = document.getElementById("loading");
    const dateText = document.getElementById("dateText");
    const counter = document.getElementById("counter");
    const info = document.getElementById("info");
    const todayBtn = document.getElementById("todayBtn");
    const randomBtn = document.getElementById("randomBtn");

    let dailyIndex = 0;
    let shuffledOrder = [];

    function pad(n) { return String(n).padStart(3, "0"); }

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function makeOrder(year) {
      const a = Array.from({length: IMAGE_COUNT}, (_, i) => i + 1);
      let seed = hashString("daily-photo-" + year);
      function random() {
        seed += 0x6D2B79F5;
        let t = seed;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      }
      // Fixed the cut-off Fisher-Yates shuffle loop here
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay);
    }

    function loadQuote(index, isRandom = false) {
      loading.style.display = "block";
      photo.hidden = true;

      const imgNumber = shuffledOrder[index - 1];
      photo.src = `${IMAGE_FOLDER}${pad(imgNumber)}.${IMAGE_EXT}`;
      
      photo.onload = () => {
        loading.style.display = "none";
        photo.hidden = false;
      };

      photo.onerror = () => {
        loading.style.display = "none";
        info.innerHTML = `<strong>Error:</strong> Could not load image ${pad(imgNumber)}.${IMAGE_EXT}`;
      };

      if (!isRandom) {
        counter.textContent = `Quote ${index} / ${IMAGE_COUNT}`;
      } else {
        counter.textContent = `Random Quote (Pool size: ${IMAGE_COUNT})`;
      }
    }

    // Initialize layout setup
    const today = new Date();
    shuffledOrder = makeOrder(today.getFullYear());
    dailyIndex = getDayOfYear(today);
    
    // Set text display
    dateText.textContent = today.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    
    // Load initial item
    loadQuote(dailyIndex);

    // Event hooks
    todayBtn.addEventListener("click", () => {
      loadQuote(dailyIndex, false);
    });

    randomBtn.addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * IMAGE_COUNT) + 1;
      loadQuote(randomIndex, true);
    });
  });
</script>
</body>
</html>
